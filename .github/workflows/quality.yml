name: quality
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cp .env.production.example .env.production
      - run: docker compose -f compose.production.yaml config --quiet
      - uses: azure/setup-kubectl@v4
      - run: kubectl kustomize deploy/kubernetes/overlays/production > /dev/null
      - run: docker build -t prometheus-planning:test .
