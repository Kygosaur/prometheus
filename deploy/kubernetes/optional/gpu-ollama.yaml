apiVersion: apps/v1
kind: Deployment
metadata: {name: ollama, namespace: prometheus-planning}
spec:
  replicas: 1
  selector: {matchLabels: {app: ollama}}
  template:
    metadata: {labels: {app: ollama}}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.11.4
          env: [{name: OLLAMA_NUM_PARALLEL, value: "1"}, {name: OLLAMA_MAX_LOADED_MODELS, value: "1"}, {name: OLLAMA_MAX_QUEUE, value: "64"}]
          ports: [{containerPort: 11434}]
          resources: {requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}, limits: {cpu: "8", memory: 24Gi, nvidia.com/gpu: "1"}}
          volumeMounts: [{name: models, mountPath: /root/.ollama}]
      volumes: [{name: models, persistentVolumeClaim: {claimName: ollama-models}}]
---
apiVersion: v1
kind: Service
metadata: {name: ollama, namespace: prometheus-planning}
spec: {selector: {app: ollama}, ports: [{port: 11434}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: ollama-models, namespace: prometheus-planning}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 50Gi}}}
