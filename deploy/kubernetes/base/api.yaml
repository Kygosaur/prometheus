apiVersion: apps/v1
kind: Deployment
metadata: {name: planning-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: planning-api}}
  template:
    metadata: {labels: {app: planning-api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: migrate
          image: ghcr.io/kygosaur/prometheus:latest
          command: [alembic, upgrade, head]
          envFrom: [{configMapRef: {name: planning-config}}, {secretRef: {name: planning-secrets}}]
      containers:
        - name: api
          image: ghcr.io/kygosaur/prometheus:latest
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: planning-config}}, {secretRef: {name: planning-secrets}}]
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: "1", memory: 1Gi}, limits: {cpu: "4", memory: 8Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: files, mountPath: /app/data, subPath: data, readOnly: true}, {name: files, mountPath: /app/documents, subPath: documents, readOnly: true}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: files, persistentVolumeClaim: {claimName: planning-files}}, {name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: planning-api}
spec: {selector: {app: planning-api}, ports: [{port: 8000, targetPort: 8000}]}
