apiVersion: apps/v1
kind: Deployment
metadata: {name: planning-worker}
spec:
  replicas: 2
  selector: {matchLabels: {app: planning-worker}}
  template:
    metadata: {labels: {app: planning-worker}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/kygosaur/prometheus:latest
          command: [rq, worker, --url, redis://redis:6379/0, planning]
          envFrom: [{configMapRef: {name: planning-config}}, {secretRef: {name: planning-secrets}}]
          resources: {requests: {cpu: "1", memory: 1Gi}, limits: {cpu: "4", memory: 8Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: files, mountPath: /app/data, subPath: data, readOnly: true}, {name: files, mountPath: /app/documents, subPath: documents, readOnly: true}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: files, persistentVolumeClaim: {claimName: planning-files}}, {name: tmp, emptyDir: {}}]
