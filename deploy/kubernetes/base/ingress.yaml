apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: planning
  annotations: {nginx.ingress.kubernetes.io/ssl-redirect: "true"}
spec:
  tls: [{hosts: [planning.example.internal], secretName: planning-tls}]
  rules:
    - host: planning.example.internal
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: planning-api, port: {number: 8000}}}}]}
